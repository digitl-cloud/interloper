# Local telemetry stack: OTLP collector → Tempo (traces) + Prometheus (metrics),
# both wired into a pre-provisioned Grafana. Ports are chosen to stay clear of
# the interloper dev instance (3000/3001).
name: interloper-telemetry-example

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — where the pipeline sends
      - "4318:4318" # OTLP HTTP
      - "9464:9464" # scraped by Prometheus
    depends_on:
      - tempo
      - prometheus

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200" # internal only; Grafana reaches it over the compose network

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      # The collector pushes metrics rather than being scraped, so that a
      # short-lived pipeline run can't finish before a scrape lands.
      - --web.enable-otlp-receiver
      # Writes a zero sample at each counter's start timestamp, so a counter
      # whose first observed value is 1 is understood to have risen from 0.
      # Without it the first run of every series is invisible to increase().
      - --enable-feature=created-timestamp-zero-ingestion
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # Anonymous admin: this is a throwaway local demo, not a deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "8080:3000"
    depends_on:
      - tempo
      - prometheus

volumes:
  tempo-data:
  prometheus-data:
