apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # How often data actually arrives (the framework's metric_export_interval).
      # Grafana sizes $__rate_interval from this; left at its 15s default
      # assumption the rate windows fall between samples and every rate-based
      # panel reads zero.
      timeInterval: 15s

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # "Span duration" panels in the trace view, and a jump from a span
      # straight to the matching interloper metrics.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: interloper.asset.key
            value: asset_key
        queries:
          - name: Asset duration p95
            query: >-
              histogram_quantile(0.95, sum by (le)
              (rate(interloper_asset_duration_seconds_bucket{$__tags}[5m])))
      nodeGraph:
        enabled: true
