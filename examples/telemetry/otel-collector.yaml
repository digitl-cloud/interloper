receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    # Short so a demo run shows up in Grafana within a couple of seconds.
    timeout: 1s

  # Runs export their metrics as deltas ("N happened since my last export"),
  # because a short-lived process has no earlier sample to be differenced
  # against. This accumulates those deltas into one continuous cumulative
  # series per stream — owned by the collector, which outlives every run —
  # which is what Prometheus' rate()/increase() are built for.
  deltatocumulative:
    # Hold a stream's accumulated state this long without new deltas. Must be
    # at least the exporter's metric_expiration below: if the running total is
    # dropped while the series is still published, the next delta restarts the
    # count from zero and the counter appears to reset.
    max_stale: 25h

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Exposed for Prometheus to scrape, rather than pushed. The collector is
  # long-lived and holds the accumulated totals, so scraping it has none of
  # the ephemeral-producer problems: the series exists continuously, and
  # OpenMetrics carries each counter's created timestamp — which is what
  # lets Prometheus record that a counter now reading 1 started from 0.
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
    # Keep publishing a counter this long after its last update. The default
    # is 5 minutes, which silently drops the totals of any pipeline idle for
    # longer — the series goes stale and every instant query reads zero, even
    # though the runs happened. Runs here are minutes to hours apart.
    metric_expiration: 24h
    # Keeps service.name/interloper.role as labels rather than folding them
    # into a separate target_info metric.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [deltatocumulative, batch]
      exporters: [prometheus]
