receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    # Short so a demo run shows up in Grafana within a couple of seconds.
    timeout: 1s

  # Runs export their metrics as deltas ("N happened since my last export"),
  # because a short-lived process has no earlier sample to be differenced
  # against. This accumulates those deltas into one continuous cumulative
  # series per stream — owned by the collector, which outlives every run —
  # which is what Prometheus' rate()/increase() are built for.
  deltatocumulative:
    # Drop a stream's accumulated state after this long without new deltas,
    # so idle series don't pin memory forever.
    max_stale: 30m

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    # Keeps service.name/interloper.role as labels instead of folding them
    # into a single target_info metric.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [deltatocumulative, batch]
      exporters: [prometheusremotewrite]
