[project]
name = "interloper-example"
version = "0.1.0"
description = "An example extension: an API route and a page built with the @interloper/ui SDK"
requires-python = ">=3.11"
dependencies = ["interloper-api"]

[project.entry-points."interloper.extensions"]
example = "interloper_example"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
