# Fan-in across platforms: match campaigns from two advertising star schemas
# into one canonical lookup table. See docs/guide/dependencies.md ("Fan-in
# across sources") for how CampaignMatcher's *.dim_campaigns wildcard relation
# wires this without either star schema knowing the matcher exists.
#
#   interloper run -f examples/campaign_matcher.yaml --dry-run             # validate + print the plan
#   interloper run -f examples/campaign_matcher.yaml --date 2026-01-01
#
path: interloper.job.cron.CronJob
init:
  cron: "0 6 * * *"

  destinations:
    - key: bigquery_destination
      id: bq
      init:
        project: dwh
        location: EU
        connection:
          key: google_cloud_connection
          init:
            service_account_key: ${GCP_SERVICE_ACCOUNT_KEY}

  targets:
    - key: facebook_ads_star_schema
      init:
        # enabled: false keeps this asset read-only in this job: it is
        # never run here, only read back so campaign_matches below can fan it
        # in alongside the other platform's campaigns.
        assets:
          dim_campaigns: {id: fb-campaigns, enabled: false}

    - key: tiktok_ads_star_schema
      init:
        assets:
          dim_campaigns: {id: tt-campaigns, enabled: false}

    - key: campaign_matcher
      init:
        assets:
          campaign_matches:
            # Each ref points at a dim_campaigns asset declared above. An
            # asset always lives under its source, so an upstream is always a
            # {ref: id} here, never written out in full.
            campaigns: [{ref: fb-campaigns}, {ref: tt-campaigns}]
