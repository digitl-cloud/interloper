# =============================================================================
# CI test values
#
# Minimum overrides to make `helm template` render successfully against the
# default chart values, which intentionally require Postgres connection
# details up front so production installs can't silently drift.
#
# Used by the Helm lint job in .github/workflows/checks.yaml; mirrors the
# convention picked up by chart-testing (`ct`).
# =============================================================================

externalPostgres:
  host: postgres.example.com

secrets:
  postgresPassword: ci-test-password
  env:
    INTERLOPER_BING_ADS_DEVELOPER_TOKEN: ci-test-token

# Render the optional MCP workload and the HTTPRoute so lint covers them
# (disabled templates are skipped entirely).
mcp:
  enabled: true

httpRoute:
  enabled: true
  parentRefs:
    - name: ci-gateway

# Cover the env every interloper pod shares, with a component's own after it.
extraEnvFrom:
  - secretRef:
      name: ci-connectors
extraEnv:
  - name: INTERLOPER_GOOGLE_ADS_DEVELOPER_TOKEN
    valueFrom:
      secretKeyRef:
        name: ci-google-ads
        key: developer-token
scheduler:
  extraEnv:
    - name: CI_SCHEDULER_ONLY
      value: "1"
