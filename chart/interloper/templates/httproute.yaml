{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "interloper.fullname" . }}
  labels:
    {{- include "interloper.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.api.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.apiPath }}
      backendRefs:
        - name: {{ include "interloper.fullname" . }}-api
          port: {{ .Values.api.service.port }}
    {{- end }}
    {{- if .Values.mcp.enabled }}
    # /mcp is the protocol endpoint; the well-known prefix carries the RFC
    # 9728 protected-resource metadata the server publishes for it.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: {{ include "interloper.fullname" . }}-mcp
          port: {{ .Values.mcp.service.port }}
    {{- end }}
    {{- if .Values.frontend.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.rootPath }}
      backendRefs:
        - name: {{ include "interloper.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
    {{- end }}
{{- end }}
