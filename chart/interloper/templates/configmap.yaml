{{/*
Generated interloper.yaml mounted into every pod at /etc/interloper/interloper.yaml.
Assembled from the root-level feature blocks (agent, launcher, runner,
catalog, smtp, auth) plus the extraConfig passthrough; the root-level
`catalog` list becomes the `catalog.include` setting. Kubernetes launcher
and runner defaults (image, namespace, service account) and the API's
in-cluster URL run pods report to (server.internal_url) are auto-filled
from the release context.

Chart-managed sections may not appear in extraConfig: their root block is the
single source of truth, and the blocks below would replace them. Any other
section may, an extension's included; the env vars the chart injects (the
database credentials, the encryption key, the external URL) beat the file
field by field.
*/}}
{{- range $key := list "agent" "launcher" "runner" "catalog" "smtp" "auth" "log" -}}
  {{- if hasKey $.Values.extraConfig $key -}}
    {{- fail (printf "extraConfig.%s is not allowed — this section is chart-managed; set the root-level `%s` value instead" $key $key) -}}
  {{- end -}}
{{- end -}}
{{- if and .Values.agent.enabled (not .Values.agent.model) -}}
  {{- fail "agent.model is required when agent.enabled is true: name a pydantic-ai provider:model" -}}
{{- end -}}
{{- $cfg := deepCopy .Values.extraConfig -}}
{{- $agent := dict "enabled" .Values.agent.enabled -}}
{{- with .Values.agent.model -}}
  {{- $_ := set $agent "model" . -}}
{{- end -}}
{{- $_ := set $cfg "agent" $agent -}}
{{- $_ := set $cfg "launcher" (deepCopy .Values.launcher) -}}
{{- $_ := set $cfg "runner" (deepCopy .Values.runner) -}}
{{- with .Values.catalog -}}
  {{- $_ := set $cfg "catalog" (dict "include" .) -}}
{{- end -}}
{{- with .Values.smtp -}}
  {{- $_ := set $cfg "smtp" . -}}
{{- end -}}
{{- with .Values.auth -}}
  {{- $_ := set $cfg "auth" . -}}
{{- end -}}
{{- if eq (default "" $cfg.launcher.type) "kubernetes" -}}
  {{- if not (hasKey $cfg.launcher "config") -}}{{- $_ := set $cfg.launcher "config" dict -}}{{- end -}}
  {{- if not $cfg.launcher.config.image -}}
    {{- $_ := set $cfg.launcher.config "image" (include "interloper.schedulerImage" .) -}}
  {{- end -}}
  {{- if not $cfg.launcher.config.namespace -}}
    {{- $_ := set $cfg.launcher.config "namespace" .Release.Namespace -}}
  {{- end -}}
  {{- if and .Values.rbac.create (not $cfg.launcher.config.service_account_name) -}}
    {{- $_ := set $cfg.launcher.config "service_account_name" (include "interloper.serviceAccountName" .) -}}
  {{- end -}}
{{- end -}}
{{- if not (hasKey $cfg "server") -}}{{- $_ := set $cfg "server" dict -}}{{- end -}}
{{- if not $cfg.server.internal_url -}}
  {{- $_ := set $cfg.server "internal_url" (printf "http://%s-api:%v" (include "interloper.fullname" .) .Values.api.service.port) -}}
{{- end -}}
{{- if has (default "" $cfg.runner.type) (list "kubernetes" "k8s") -}}
  {{- if not (hasKey $cfg.runner "config") -}}{{- $_ := set $cfg.runner "config" dict -}}{{- end -}}
  {{- if not $cfg.runner.config.image -}}
    {{- $_ := set $cfg.runner.config "image" (include "interloper.coreImage" .) -}}
  {{- end -}}
  {{- if not $cfg.runner.config.namespace -}}
    {{- $_ := set $cfg.runner.config "namespace" .Release.Namespace -}}
  {{- end -}}
  {{- if and .Values.rbac.create (not $cfg.runner.config.service_account_name) -}}
    {{- $_ := set $cfg.runner.config "service_account_name" (include "interloper.serviceAccountName" .) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interloper.fullname" . }}-config
  labels:
    {{- include "interloper.labels" . | nindent 4 }}
data:
  interloper.yaml: |
{{ toYaml $cfg | indent 4 }}
