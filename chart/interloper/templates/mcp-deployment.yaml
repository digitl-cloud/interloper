{{- if .Values.mcp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interloper.fullname" . }}-mcp
  labels:
    {{- include "interloper.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "interloper.selectorLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "interloper.selectorLabels" (dict "root" . "component" "mcp") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.mcp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "interloper.image" (dict "root" . "component" "mcp" "image" .Values.mcp.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["interloper-mcp"]
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          {{- with .Values.mcp.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "interloper.commonEnv" . | nindent 12 }}
            {{- if .Values.otel.enabled }}
            - name: INTERLOPER_OTEL_SERVICE_NAME
              value: interloper-mcp
            {{- end }}
            {{- with .Values.mcp.externalUrl }}
            - name: INTERLOPER_MCP_EXTERNAL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/interloper
              readOnly: true
          workingDir: /etc/interloper
          # The only HTTP surface (/mcp) requires bearer auth, so the probes
          # settle for the socket accepting connections.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "interloper.fullname" . }}-config
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "interloper.fullname" . }}-mcp
  labels:
    {{- include "interloper.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
  {{- with .Values.mcp.service.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "interloper.selectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
{{- end }}
