{{- if and (not .Values.secrets.existingSecret) (include "interloper.hasSecret" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interloper.fullname" . }}
  labels:
    {{- include "interloper.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.postgresPassword }}
  INTERLOPER_POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  INTERLOPER_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  INTERLOPER_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  INTERLOPER_AUTH_GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.env }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
