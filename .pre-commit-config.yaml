fail_fast: false
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
  - repo: local
    hooks:
      # Agent shells export PYTHONDONTWRITEBYTECODE, which would leave every run
      # recompiling the workspace and re-rewriting the test modules.
      - id: pytest
        name: pytest
        entry: env PYTHONDONTWRITEBYTECODE= uv run pytest -n auto --maxprocesses 4
        language: system
        stages: [pre-push]
        types: [python]
        pass_filenames: false
