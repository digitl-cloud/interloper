# ============================================================================
# Zensical configuration for the Interloper documentation site.
# Build with `uv run zensical build` (or serve with `uv run zensical serve`)
# from the repository root.
# ============================================================================

[project]

site_name = "Interloper"
site_description = "The ultra-portable data asset framework"
site_author = "Digitl Cloud"

#site_url = "https://www.example.com/"

repo_url = "https://github.com/digitl-cloud/interloper"

copyright = """
Copyright &copy; 2026 Digitl Cloud
"""

nav = [
    { "Getting started" = "index.md" },
    { "Tutorial" = "tutorial.md" },
    { "Guide" = [
        { "Assets" = "guide/assets.md" },
        { "Sources" = "guide/sources.md" },
        { "Dependencies" = "guide/dependencies.md" },
        { "Resources & configs" = "guide/resources.md" },
        { "Connections" = "guide/connections.md" },
        { "OAuth providers" = "guide/oauth.md" },
        { "Configuration fields" = "guide/fields.md" },
        { "Destinations" = "guide/destinations.md" },
        { "Schemas & data contracts" = "guide/schema.md" },
        { "Normalization" = "guide/normalization.md" },
        { "Partitioning" = "guide/partitioning.md" },
        { "Execution" = "guide/execution.md" },
        { "Backfilling" = "guide/backfilling.md" },
        { "Events & logging" = "guide/events.md" },
        { "Jobs" = "guide/jobs.md" },
        { "Hooks" = "guide/hooks.md" },
        { "Specs & serialization" = "guide/specs.md" },
        { "Catalog" = "guide/catalog.md" },
        { "CLI" = "guide/cli.md" },
        { "Telemetry" = "guide/telemetry.md" },
    ] },
    { "Extending" = [
        { "Component model" = "extending/components.md" },
        { "Representations & conformers" = "extending/representations.md" },
        { "Runners" = "extending/runners.md" },
        { "Operations & workloads" = "extending/operations.md" },
        { "Entry points & registries" = "extending/entry-points.md" },
    ] },
    { "Reference" = [
        { "Decorator options" = "reference/decorators.md" },
        { "Settings" = "reference/settings.md" },
        { "CLI flags" = "reference/cli.md" },
        { "Event types" = "reference/events.md" },
        { "Spans & metrics" = "reference/telemetry.md" },
        { "Errors" = "reference/errors.md" },
        { "Utilities" = "reference/utils.md" },
        { "Ecosystem" = "reference/ecosystem.md" },
    ] },
]

extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

language = "en"

logo = "assets/logo.svg"
favicon = "assets/favicon.png"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]

# Three-state colour toggle: follow the system preference by default, with
# explicit light and dark overrides cycling through the header button.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "material/brightness-auto", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/brightness-4", name = "Switch to system preference" }
