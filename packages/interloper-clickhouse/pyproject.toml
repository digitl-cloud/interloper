# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-clickhouse"
version = "0.104.0"
description = "Interloper ClickHouse integration: connection and destination"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.10"
dependencies = [
    "clickhouse-connect[pandas]>=0.8",
    "interloper-core",
    "interloper-pandas",
]

[project.entry-points."interloper.components"]
clickhouse = "interloper_clickhouse"

[dependency-groups]
dev = ["chdb>=3.0"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-pandas = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["ANN", "F811", "D101", "D102", "D103", "D104", "RUF069", "PLW0108"]
