# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-scheduler"
version = "0.148.0"
description = "Interloper cron scheduler and queue worker"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "interloper-db",
    "croniter>=5.0.0",
]

[project.entry-points."interloper.extensions"]
scheduler = "interloper_scheduler"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]
