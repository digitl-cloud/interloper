# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-toolkit"
version = "0.147.0"
description = "Interloper tool functions shared by the AI surfaces (agent, MCP)"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "interloper-db",
]

[project.entry-points."interloper.extensions"]
toolkit = "interloper_toolkit"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.extend-per-file-ignores]
"src/interloper_toolkit/{analytics,catalog,collection,jobs,lineage,scheduling,sources}.py" = ["D417", "DOC201", "BLE001"]
