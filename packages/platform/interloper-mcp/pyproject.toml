# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-mcp"
version = "0.148.0"
description = "Interloper MCP server, platform access for AI agents"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "interloper-db",
    "interloper-toolkit",
    "mcp>=2.3,<3",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
interloper-mcp = "interloper_mcp.main:main"

[project.entry-points."interloper.extensions"]
mcp = "interloper_mcp"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }
interloper-toolkit = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.extend-per-file-ignores]
"src/interloper_mcp/tools.py" = ["DOC201"]
