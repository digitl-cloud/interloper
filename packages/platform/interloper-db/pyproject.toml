# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-db"
version = "0.132.0"
description = "Interloper database persistence layer"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "sqlmodel>=0.0.27",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.18.4",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
otel = [
    "interloper-core[otel]",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]

[project.entry-points."interloper.extensions"]
db = "interloper_db"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["ANN", "F811", "D101", "D102", "D103", "D104", "RUF069", "PLW0108"]
"src/interloper_db/migrations/versions/*.py" = ["D103"]

# ###############
# ALEMBIC
# ###############
[tool.alembic]
script_location = "src/interloper_db/migrations"
file_template = "%(rev)s_%(slug)s"
# sqlalchemy.url is set programmatically in env.py from the engine singleton.
