# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-db"
version = "0.146.0"
description = "Interloper database persistence layer"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "sqlmodel>=0.0.27",
    # opentelemetry-instrumentation-sqlalchemy refuses 2.1.
    "sqlalchemy>=2.0.0,<2.1",
    "psycopg[binary]>=3.1",
    "alembic>=1.18.4",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
otel = [
    "interloper-core[otel]",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]

[project.entry-points."interloper.extensions"]
db = "interloper_db"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"src/interloper_db/migrations/versions/*.py" = ["D103"]

# ###############
# ALEMBIC
# ###############
[tool.alembic]
script_location = "src/interloper_db/migrations"
file_template = "%(rev)s_%(slug)s"
# sqlalchemy.url is set programmatically in env.py from the engine singleton.
