# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-agent"
version = "0.148.0"
description = "Interloper AI agent, on pydantic-ai"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "interloper-db",
    "interloper-toolkit",
    "pydantic-ai-slim[google,anthropic,openai]>=2.60.0",
]

[project.entry-points."interloper.extensions"]
agent = "interloper_agent"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }
interloper-toolkit = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.extend-per-file-ignores]
"src/interloper_agent/interaction.py" = ["D417", "DOC201", "DOC501"]
