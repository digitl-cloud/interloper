# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-core"
version = "0.132.0"
description = "Interloper"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11.7",
    "pydantic-settings>=2.11.0",
    "httpx2>=2.13.1",
    "pyyaml>=6.0.0",
    "typing_extensions>=4.0.0",
    "opentelemetry-api>=1.42,<2",
]

[project.optional-dependencies]
# Instruments only what core itself depends on (httpx2); FastAPI and
# SQLAlchemy instrumentation ship with interloper-api[otel] / interloper-db[otel].
otel = [
    "opentelemetry-sdk>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=7.0.0", "opentelemetry-sdk>=1.42,<2", "pyarrow>=14"]

[project.entry-points."interloper.extensions"]
core = "interloper"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "interloper"

[project.scripts]
interloper = "interloper.cli.main:main"

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["ANN", "D101", "D102", "D104", "B018", "RUF069", "PLW0108"]

# Pytest is configured once, at the workspace root: a per-package
# [tool.pytest.ini_options] block would make it the rootdir for any run
# scoped to this package, cutting off the shared root conftest.
