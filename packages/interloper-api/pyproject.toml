# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-api"
version = "0.69.0"
description = "Interloper FastAPI routes"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.10"
dependencies = [
    "interloper-core",
    "interloper-db",
    "fastapi>=0.115.0",
    "google-auth>=2.0.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.0",
    "uvicorn[standard]>=0.41.0",
    "wsproto>=1.2.0",
]

[project.optional-dependencies]
agent = ["interloper-agent"]
otel = [
    "interloper-core[otel]",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }
interloper-agent = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI's whole dependency-injection surface is calls in argument defaults;
# B008 exists for mutable defaults, which these are not.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["ANN", "F811", "D101", "D102", "D103", "D104", "D107"]
