# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-mcp"
version = "0.110.1"
description = "Interloper MCP server, platform access for AI agents"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.10"
dependencies = [
    "interloper-core",
    "interloper-db",
    "interloper-toolkit",
    "mcp>=1.28,<2",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
interloper-mcp = "interloper_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }
interloper-toolkit = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D", "TID251"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Raw database access lives in interloper-db alone; this package reads and
# writes through the store's facets.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "Database access goes through interloper_db.Store facets"
"sqlmodel".msg = "Database access goes through interloper_db.Store facets"
"interloper_db.session".msg = "Database access goes through interloper_db.Store facets"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["TID251", "ANN", "F811", "D101", "D102", "D103", "D104", "RUF069", "PLW0108"]
