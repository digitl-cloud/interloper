# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-agent"
version = "0.79.2"
description = "Interloper AI agent powered by Google ADK"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.10"
dependencies = [
    "interloper-core",
    "interloper-db",
    "interloper-assets",
    "interloper-toolkit",
    "google-adk[extensions]>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-db = { workspace = true }
interloper-assets = { workspace = true }
interloper-toolkit = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["ANN", "F811", "D101", "D102", "D103", "D104", "RUF069", "PLW0108"]
"src/interloper_agent/tools/*.py" = ["D417", "DOC201", "D103", "BLE001"]
