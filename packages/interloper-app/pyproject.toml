# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-app"
version = "0.79.2"
description = "Interloper web UI (Nuxt SPA, bundled as static assets)"
readme = { text = "", content-type = "text/plain" }
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.10"
dependencies = ["interloper-api", "interloper-db", "interloper-scheduler"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-api = { workspace = true }
interloper-db = { workspace = true }
interloper-scheduler = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
extend-select = ["E", "I", "UP", "ANN001", "ANN201", "ANN202", "DOC", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["ANN", "F811", "D101", "D102", "D103", "D104", "RUF069", "PLW0108"]

[tool.uv.build-backend]
module-name = "interloper_app"
