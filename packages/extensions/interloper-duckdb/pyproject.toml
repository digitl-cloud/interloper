# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-duckdb"
version = "0.148.0"
description = "Interloper DuckDB integration: DuckDB and MotherDuck destination and connection"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "interloper-core",
    "interloper-pandas",
]

[project.entry-points."interloper.extensions"]
duckdb = "interloper_duckdb"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-pandas = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
