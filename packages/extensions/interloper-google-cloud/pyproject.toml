# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-google-cloud"
version = "0.146.0"
description = "Interloper Google Cloud integration: BigQuery, Cloud Storage and Google Sheets destinations"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.0",
    "google-cloud-storage>=2.0",
    "interloper-core",
    "interloper-pandas",
    "pyarrow>=14",
    "db-dtypes>=1.0",
    "pandas-gbq>=0.26.1",
]

[project.entry-points."interloper.extensions"]
google_cloud = "interloper_google_cloud"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-pandas = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
