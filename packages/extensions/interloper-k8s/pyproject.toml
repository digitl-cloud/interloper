# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-k8s"
version = "0.146.0"
description = "Interloper Kubernetes integration"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    # 36.0.0 has a broken in-cluster config: requests are sent without an Authorization
    # header and the API server rejects them as system:anonymous (fixed upstream in 36.0.1).
    "kubernetes>=31.0.0,!=36.0.0",
    "interloper-core",
    "interloper-scheduler",
]

[project.entry-points."interloper.extensions"]
k8s = "interloper_k8s"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-scheduler = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
