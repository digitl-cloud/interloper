# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-azure"
version = "0.147.0"
description = "Interloper Microsoft Azure integration: Entra connection and Microsoft Fabric Warehouse destination"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "azure-identity>=1.19",
    "mssql-python>=1.15",
]

[project.entry-points."interloper.extensions"]
azure = "interloper_azure"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
