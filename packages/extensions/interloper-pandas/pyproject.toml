# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-pandas"
version = "0.148.0"
description = "Interloper pandas integration: DataFrame normalizer and adapter"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = ["interloper-core", "pandas>=1.5"]

[project.entry-points."interloper.extensions"]
pandas = "interloper_pandas"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
