# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-databricks"
version = "0.147.0"
description = "Interloper Databricks integration: connection and destination"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "interloper-pandas",
    "databricks-sql-connector[pyarrow]>=4.1.2",
]

[project.entry-points."interloper.extensions"]
databricks = "interloper_databricks"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-pandas = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
