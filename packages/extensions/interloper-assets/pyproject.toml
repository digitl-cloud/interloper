# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-assets"
version = "0.147.0"
description = "Interloper Assets"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "interloper-pandas",
    "interloper-sql",
    "httpx2>=2.13.1",
    "tenacity>=9.1.4",
    "google-auth>=2.40.0",
]

[project.optional-dependencies]
bing = ["bingads>=13.0.24.1"]
facebook = ["facebook-business>=20.0.0"]

[project.entry-points."interloper.extensions"]
assets = "interloper_assets"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-pandas = { workspace = true }
interloper-sql = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"**/schemas/**" = ["E501", "D100", "D101"]
"src/interloper_assets/*/*/source.py" = ["DOC201", "DOC501"]
"src/interloper_assets/*/assets.py" = ["DOC201"]
"src/interloper_assets/*/*.py" = ["D100"]
"src/interloper_assets/*/*/*.py" = ["D100"]
"src/interloper_assets/*/__init__.py" = ["D104"]
"src/interloper_assets/*/*/__init__.py" = ["D104"]
"src/interloper_assets/*/*/schemas/__init__.py" = ["D104"]
