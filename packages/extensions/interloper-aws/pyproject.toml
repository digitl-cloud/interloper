# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-aws"
version = "0.147.0"
description = "Interloper AWS integration: Amazon S3 destination and connection"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "interloper-core",
    "boto3>=1.34",
    "pyarrow>=14",
]

[project.entry-points."interloper.extensions"]
aws = "interloper_aws"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
