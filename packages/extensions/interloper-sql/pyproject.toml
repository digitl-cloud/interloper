# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-sql"
version = "0.148.0"
description = "Interloper SQL integration: portable views over SQL warehouses, and a SQLAlchemy-backed destination for PostgreSQL and other SQL databases"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "ibis-framework>=12,<13",
    "interloper-core",
    # ibis's SQL compilers package imports it on load but declares it only in backend extras
    "packaging>=21.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0"]

[project.entry-points."interloper.extensions"]
sql = "interloper_sql"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
