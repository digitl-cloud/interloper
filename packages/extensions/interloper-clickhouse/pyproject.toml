# ###############
# PROJECT / UV
# ###############
[project]
name = "interloper-clickhouse"
version = "0.148.0"
description = "Interloper ClickHouse integration: connection and destination"
readme = "README.md"
authors = [{ name = "Guillaume Onfroy", email = "guillaume@digitlcloud.com" }]
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect[pandas]>=0.8",
    "interloper-core",
    "interloper-pandas",
]

[project.entry-points."interloper.extensions"]
clickhouse = "interloper_clickhouse"

[dependency-groups]
dev = ["chdb>=3.0"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
interloper-core = { workspace = true }
interloper-pandas = { workspace = true }

# ###############
# RUFF
# ###############
[tool.ruff]
extend = "../../../pyproject.toml"
