name: Docs

# Publishes the documentation site to GitHub Pages on every change to main.
#
# The site is built with zensical from docs/ + zensical.toml and pushed into
# the gh-pages branch, which the CNAME file makes Pages serve at
# docs.interloper.dev.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: UV setup
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build site
        # Same isolated invocation the docs image used: zensical alone, no
        # workspace sync. Keep the version in step with pyproject's dev group.
        run: uv run --no-project --with "zensical>=0.0.24" zensical build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: false
          cname: docs.interloper.dev
          commit_message: "docs: publish ${{ github.sha }}"
