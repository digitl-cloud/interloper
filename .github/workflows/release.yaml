name: Release

# Cuts the release only: checks, semantic-release (version bump, tag,
# changelog, GitHub release) and the PyPI publish. Docker images and the
# Helm chart are published by the Publish workflow, which fires on the
# GitHub release semantic-release publishes — and can be re-run for that
# tag independently.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - stable
          - release-candidate
        default: stable
      force:
        description: >-
          Force a bump when the commits alone don't warrant one (e.g. only
          chore/refactor since the last release). "auto" = normal
          commit-driven behaviour.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

jobs:
  release:
    name: Release (${{ inputs.release_type }})
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: "write"
      id-token: "write"

    steps:
      - name: Get GitHub App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: UV setup
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.10"
          cache-suffix: "3.10"

      - name: UV sync
        run: uv sync --all-packages --all-extras

      - name: Ruff
        run: uv run ruff check packages

      - name: ty
        run: uv run ty check

      - name: Pytest
        run: uv run pytest

      # Runs PSR directly instead of python-semantic-release/python-semantic-release@v10:
      # the action installs its dependencies unpinned at image build, and GitPython
      # 3.1.60 removed Actor.name_email_regex, which crashes PSR's config load
      # (python-semantic-release/python-semantic-release#1476). Restore the action
      # once a PSR release ships the fix. The venv python provides the pip that the
      # configured build_command bootstraps uv with.
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/psr"
          "$RUNNER_TEMP/psr/bin/pip" install --quiet "python-semantic-release==10.6.1" "gitpython==3.1.59"
          export PATH="$RUNNER_TEMP/psr/bin:$PATH"

          git config user.name "Semantic Release"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          flags=(--commit --tag --vcs-release --prerelease-token rc)
          if [ "${{ inputs.release_type }}" = "release-candidate" ]; then
            flags+=(--as-prerelease --no-changelog)
          else
            flags+=(--changelog)
          fi
          # Force a bump level when the commit history alone wouldn't trigger a
          # release (only chore/refactor since the last tag). "auto" = let PSR
          # decide from the Conventional Commits, the normal path.
          if [ "${{ inputs.force }}" != "auto" ]; then
            flags+=(--${{ inputs.force }})
          fi

          before=$(git rev-parse HEAD)
          semantic-release -v version "${flags[@]}"
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Publish
        if: steps.release.outputs.released == 'true'
        run: |
          uv build --all-packages
          uv publish --trusted-publishing always
