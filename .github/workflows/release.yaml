name: Release

# Cuts a version with semantic-release (version bump, release commit, tag,
# changelog, GitHub release). It runs no checks of its own: it releases only a
# commit that main's Checks workflow passed, waiting for Checks when it is still
# running. It publishes nothing: the GitHub release it creates triggers the
# Publish workflow, which builds the tag and publishes it to PyPI, npm and GHCR.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - stable
          - release-candidate
        default: stable
      force:
        description: >-
          Force a bump when the commits alone don't warrant one (e.g. only
          chore/refactor since the last release). "auto" = normal
          commit-driven behaviour.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

jobs:
  release:
    name: Release (${{ inputs.release_type }})
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: "write"
      actions: "read"

    steps:
      - name: Require Checks to have passed
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yaml --commit "$GITHUB_SHA" \
            --json databaseId,status,conclusion,url)"
          if [ "$(jq length <<<"$runs")" -eq 0 ]; then
            echo "::error::Checks has not run for ${GITHUB_SHA}. It skips a commit that touches only the paths it" \
              "ignores, and a [skip ci] one. Run it on main (gh workflow run checks.yaml --ref main), then release."
            exit 1
          fi
          # A release usually follows the merge whose Checks is still running:
          # a run that passed settles it, else the run still going is waited for.
          run="$(jq -c 'first(.[] | select(.conclusion == "success"))
            // first(.[] | select(.status != "completed")) // .[0]' <<<"$runs")"
          id="$(jq -r .databaseId <<<"$run")"
          if [ "$(jq -r .status <<<"$run")" != "completed" ]; then
            echo "Waiting for Checks on ${GITHUB_SHA}: $(jq -r .url <<<"$run")"
          fi
          until [ "$(jq -r .status <<<"$run")" = "completed" ]; do
            sleep 15
            run="$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url)"
          done
          if [ "$(jq -r .conclusion <<<"$run")" != "success" ]; then
            echo "::error::Checks has not passed for ${GITHUB_SHA}: $(jq -r '"\(.conclusion), \(.url)"' <<<"$run")"
            exit 1
          fi
          echo "Checks passed for ${GITHUB_SHA}: $(jq -r .url <<<"$run")"

      - name: Get GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: UV setup
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          python-version: "3.11"

      # Sets the outputs the python-semantic-release action set (released,
      # version, tag, ...): the CLI writes them itself under GitHub Actions.
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMITTER_NAME: "Semantic Release"
          COMMITTER_EMAIL: "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          RELEASE_TYPE: ${{ inputs.release_type }}
          FORCE: ${{ inputs.force }}
        run: |
          git config --global user.name "$COMMITTER_NAME"
          git config --global user.email "$COMMITTER_EMAIL"
          export GIT_COMMIT_AUTHOR="${COMMITTER_NAME} <${COMMITTER_EMAIL}>"

          # No --skip-build: the configured build_command (`uv lock`) gives the
          # release commit a lock file consistent with the stamped versions.
          # The packages themselves are built by the Publish workflow.
          args=(--commit --tag --vcs-release --prerelease-token rc)
          if [ "$RELEASE_TYPE" = "release-candidate" ]; then
            args+=(--as-prerelease --no-changelog)
          else
            args+=(--changelog)
          fi
          # Force a bump level when the commit history alone wouldn't trigger a
          # release (only chore/refactor since the last tag). "auto" lets PSR
          # decide from the Conventional Commits, the normal path.
          if [ "$FORCE" != "auto" ]; then
            args+=("--${FORCE}")
          fi

          uvx --from 'python-semantic-release>=10,<11' semantic-release -v version "${args[@]}"
