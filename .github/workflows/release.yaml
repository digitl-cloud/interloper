name: Release

# Cuts a version: checks, then semantic-release (version bump, release commit,
# tag, changelog, GitHub release). It publishes nothing: the GitHub release it
# creates triggers the Publish workflow, which builds the tag and publishes it
# to PyPI, npm and GHCR. Re-running it after a release finds the tag and does
# nothing.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - stable
          - release-candidate
        default: stable
      force:
        description: >-
          Force a bump when the commits alone don't warrant one (e.g. only
          chore/refactor since the last release). "auto" = normal
          commit-driven behaviour.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

jobs:
  release:
    name: Release (${{ inputs.release_type }})
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: "write"

    steps:
      - name: Get GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: UV setup
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
          cache-suffix: "3.11"

      - name: UV sync
        run: uv sync --all-packages --all-extras

      - name: Ruff
        run: uv run ruff check packages

      - name: Ruff format
        run: uv run ruff format --check

      - name: ty
        run: uv run ty check

      - name: Pytest
        run: uv run pytest -n auto --maxprocesses 4

      - name: Release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          prerelease: ${{ inputs.release_type == 'release-candidate' }}
          prerelease_token: rc
          # Force a bump level when the commit history alone wouldn't trigger a
          # release (only chore/refactor since the last tag). Empty = let PSR
          # decide from the Conventional Commits, the normal path.
          force: ${{ inputs.force != 'auto' && inputs.force || '' }}
          # Runs the configured build_command (`uv lock`) so the release
          # commit carries a lock file consistent with the stamped versions.
          # The packages themselves are built by the Publish workflow.
          build: true
          changelog: ${{ inputs.release_type == 'stable' }}
          commit: true
          tag: true
          vcs_release: true
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_email: "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git_committer_name: "Semantic Release"
