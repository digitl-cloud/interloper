name: Release

# Cuts the release only: checks, semantic-release (version bump, tag,
# changelog, GitHub release) and the PyPI publish. Docker images and the
# Helm chart are published by the Publish workflow, which fires on the
# GitHub release semantic-release publishes — and can be re-run for that
# tag independently.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - stable
          - release-candidate
        default: stable
      force:
        description: >-
          Force a bump when the commits alone don't warrant one (e.g. only
          chore/refactor since the last release). "auto" = normal
          commit-driven behaviour.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

jobs:
  release:
    name: Release (${{ inputs.release_type }})
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: "write"
      id-token: "write"

    steps:
      - name: Get GitHub App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: UV setup
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.10"
          cache-suffix: "3.10"

      - name: UV sync
        run: uv sync --all-packages --all-extras

      - name: Ruff
        run: uv run ruff check packages

      - name: ty
        run: uv run ty check

      - name: Pytest
        run: uv run pytest

      # TEMPORARY: runs the same PSR CLI the python-semantic-release@v10
      # action runs, via uvx with GitPython pinned. GitPython 3.1.60 removed
      # Actor.name_email_regex, which breaks every PSR config load inside the
      # action's image (python-semantic-release/python-semantic-release#1476).
      # Revert to the action once a PSR release carries the fix (PR #1477).
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "Semantic Release"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          flags="--commit --tag --vcs-release --prerelease-token rc"
          if [ "${{ inputs.release_type }}" = "release-candidate" ]; then
            flags="$flags --no-changelog --as-prerelease"
          else
            flags="$flags --changelog"
          fi
          # Force a bump level when the commit history alone wouldn't trigger a
          # release (only chore/refactor since the last tag). auto = let PSR
          # decide from the Conventional Commits, the normal path.
          if [ "${{ inputs.force }}" != "auto" ]; then
            flags="$flags --${{ inputs.force }}"
          fi

          # The configured build_command (`uv lock`) runs as part of `version`,
          # so the release commit carries a lock file consistent with the
          # stamped versions. The actual package build happens in the publish
          # step below.
          # --with pip: the configured build_command bootstraps uv via
          # `python -m pip`, and uv-managed venvs ship without pip.
          uvx --from "python-semantic-release==10.6.1" --with "gitpython<3.1.60" --with pip \
            semantic-release -v version $flags

          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Publish
        if: steps.release.outputs.released == 'true'
        run: |
          uv build --all-packages
          uv publish --trusted-publishing always
