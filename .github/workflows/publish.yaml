name: Publish

# Publishes a released tag everywhere: the Python packages to PyPI,
# @interloper/ui to npm, the Docker images and the Helm chart to GHCR. Every
# publish job makes the version present and skips what already is, and none
# waits on another, so one registry's outage blocks only its own job. A failed
# job is recovered with "Re-run failed jobs": the jobs that succeeded stay
# done, and a re-run PyPI or npm job publishes the same build artifact. Once
# every image is tagged, a stable release is announced to the downstream
# pipeline trigger, when the repository configures one.
#
# Triggers:
#   - automatically when semantic-release publishes the GitHub release
#     (created with the GitHub App token, so the event fires workflows).
#     Not the tag push: the release commit message carries `[skip ci]`,
#     which suppresses the push event for the tag pointing at it, while the
#     `release` event is immune to skip instructions;
#   - manually via workflow_dispatch with an existing tag, which rebuilds the
#     tag and publishes whatever is still missing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true
        type: string

jobs:
  resolve:
    name: Resolve tag
    # Only semantic-release tags are published: the no-`v` chart releases
    # chart-releaser left behind must never re-trigger this workflow.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      stable: ${{ steps.resolve.outputs.stable }}

    steps:
      - name: Resolve tag
        id: resolve
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          case "$version" in
            *-rc*) stable=false ;;
            *)     stable=true ;;
          esac
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "stable=${stable}"
          } >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────
  # Build: the wheels, sdists and SDK tarball the PyPI and npm jobs publish
  #
  # Built once from the tag into one artifact, so a re-run publish job uploads
  # the very files the first attempt did, and a build that fails publishes
  # nothing to either registry. interloper-app's wheel carries the SPA and
  # each extension's wheel its UI bundle, so those build first.
  # ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: resolve
    runs-on: ubuntu-latest

    permissions:
      contents: "read"

    steps:
      - name: Checkout (released tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: UV setup
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build the app and extension UIs
        run: make build-app build-extensions

      - name: Build the Python packages
        run: uv build --all-packages --out-dir dist/pypi

      - name: Pack the UI SDK
        working-directory: packages/platform/interloper-app/sdk
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/npm"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Python packages → PyPI, with trusted publishing (no token)
  #
  # A file name PyPI lists can never take other content, so a file PyPI
  # already has is skipped by name, whichever build uploaded it: a rebuild of
  # the tag differs byte-wise in interloper-app (Nuxt stamps each SPA build
  # with a fresh id), and `--check-url`, which compares hashes, would stop the
  # whole upload there. `--check-url` still covers an upload that errors after
  # PyPI stored the file.
  # ────────────────────────────────────────────────────────────────────
  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: "write"

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Skip the files PyPI has
        shell: python
        run: |
          import json
          import pathlib
          import urllib.error
          import urllib.request

          listed = {}
          for path in sorted(pathlib.Path("dist/pypi").iterdir()):
              project = path.name.split("-")[0].replace("_", "-")
              if project not in listed:
                  request = urllib.request.Request(
                      f"https://pypi.org/simple/{project}/",
                      headers={"Accept": "application/vnd.pypi.simple.v1+json"},
                  )
                  try:
                      with urllib.request.urlopen(request) as response:
                          listed[project] = {file["filename"] for file in json.load(response)["files"]}
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      listed[project] = set()
              if path.name in listed[project]:
                  print(f"{path.name} is on PyPI already")
                  path.unlink()

      - name: UV setup
        uses: astral-sh/setup-uv@v10.3.3

      - name: Publish
        run: |
          if [ -z "$(ls dist/pypi)" ]; then
            echo "Every file is on PyPI already."
            exit 0
          fi
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/pypi/*

  # ────────────────────────────────────────────────────────────────────
  # @interloper/ui → npm, with trusted publishing and provenance (no token)
  #
  # npm never takes a version twice, so a version the registry answers for is
  # published. A release candidate goes out under the `rc` dist-tag: npm
  # refuses a prerelease without one, and it must never become `latest`.
  # ────────────────────────────────────────────────────────────────────
  npm:
    name: npm
    needs: [resolve, build]
    runs-on: ubuntu-latest

    permissions:
      id-token: "write"

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Publish
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DIST_TAG: ${{ needs.resolve.outputs.stable == 'true' && 'latest' || 'rc' }}
        run: |
          if [ "$(npm view "@interloper/ui@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@interloper/ui@${VERSION} is on npm already."
            exit 0
          fi
          npm --version
          npm publish "dist/npm/interloper-ui-${VERSION}.tgz" --provenance --access public --tag "$DIST_TAG"

  # ────────────────────────────────────────────────────────────────────
  # Docker images → GitHub Container Registry (ghcr.io)
  #
  # One image per role, tagged with the released version (plus `latest` on
  # stable releases only). Each Python role ships two variants: the loaded
  # image on the bare tag, and the extras-free one on a "-slim" tag. The
  # image list mirrors the image catalog in the Makefile (ROLES + SLIM_ROLES),
  # keep the two in sync.
  #
  # Each image builds once per architecture, each on a runner of that
  # architecture, and is pushed by digest only. `docker-merge` then tags the
  # two digests as one multi-arch index. A merge waits on every build, but
  # runs whenever its own two digests exist, so one image's failed build
  # holds back only that image.
  # ────────────────────────────────────────────────────────────────────
  docker:
    name: Docker (${{ matrix.image.target }}, ${{ matrix.platform.arch }})
    needs: resolve
    runs-on: ${{ matrix.platform.runner }}

    permissions:
      contents: "read"
      packages: "write"

    strategy:
      fail-fast: false
      matrix:
        # target → dockerfile target (also the Makefile stem)
        # role   → image name (interloper-<role>); suffix → tag suffix
        image: &images
          - { target: api,            role: api,       suffix: "" }
          - { target: api-slim,       role: api,       suffix: "-slim" }
          - { target: frontend,       role: frontend,  suffix: "" }
          - { target: core,           role: core,      suffix: "" }
          - { target: core-slim,      role: core,      suffix: "-slim" }
          - { target: mcp,            role: mcp,       suffix: "" }
          - { target: mcp-slim,       role: mcp,       suffix: "-slim" }
          - { target: scheduler,      role: scheduler, suffix: "" }
          - { target: scheduler-slim, role: scheduler, suffix: "-slim" }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }

    steps:
      - name: Checkout (released tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/interloper-${{ matrix.image.role }}" >> "$GITHUB_OUTPUT"

      # No build args: the dockerfile's own defaults define what a loaded
      # image carries, and the slim targets take no extras at all.
      - name: Build & Push (${{ matrix.image.target }}, ${{ matrix.platform.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.image.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.image.target }}-${{ matrix.platform.arch }},mode=max,ignore-error=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.target }}.${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true

  docker-merge:
    name: Docker merge (${{ matrix.image.target }})
    needs: [resolve, docker]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      packages: "write"

    strategy:
      fail-fast: false
      matrix:
        image: *images

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image.target }}.*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        env:
          ROLE: ${{ matrix.image.role }}
          SUFFIX: ${{ matrix.image.suffix }}
          VERSION: ${{ needs.resolve.outputs.version }}
          STABLE: ${{ needs.resolve.outputs.stable }}
        run: |
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected an amd64 and an arm64 digest, found ${#digests[@]}: a build of this image failed."
            exit 1
          fi
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/interloper-${ROLE}"
          tags=(--tag "${repo}:${VERSION}${SUFFIX}")
          if [ "$STABLE" = "true" ]; then
            tags+=(--tag "${repo}:latest${SUFFIX}")
          fi
          docker buildx imagetools create "${tags[@]}" "${digests[@]/#/${repo}@sha256:}"
          docker buildx imagetools inspect "${repo}:${VERSION}${SUFFIX}"

  # ────────────────────────────────────────────────────────────────────
  # Downstream: a deployment's own build on top of the published images
  #
  # A deployment that builds its images from these ones sets the secrets
  # DOWNSTREAM_TRIGGER_URL and DOWNSTREAM_TRIGGER_TOKEN, a GitLab pipeline
  # trigger; without them the job does nothing. It runs once every image is
  # tagged, on stable releases, and passes the version as PLATFORM_VERSION.
  # The response is discarded: it names the downstream project.
  # ────────────────────────────────────────────────────────────────────
  downstream:
    name: Downstream
    needs: [resolve, docker-merge]
    if: needs.resolve.outputs.stable == 'true'
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Trigger
        env:
          URL: ${{ secrets.DOWNSTREAM_TRIGGER_URL }}
          TOKEN: ${{ secrets.DOWNSTREAM_TRIGGER_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "No downstream trigger configured."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --output /dev/null \
            --form-string "token=${TOKEN}" \
            --form-string "ref=main" \
            --form-string "variables[PLATFORM_VERSION]=${VERSION}" \
            "$URL"

  # ────────────────────────────────────────────────────────────────────
  # Helm chart → GitHub Container Registry (ghcr.io)
  #
  # Pushed as an OCI artifact beside the images it deploys, carrying the same
  # version, so the chart needs no index file and no GitHub Pages. Stable
  # releases only — RC chart versions would clutter the registry. The chart
  # is packaged at the tag's version whatever Chart.yaml says, so a stamp the
  # release missed can never publish the previous version again.
  # ────────────────────────────────────────────────────────────────────
  helm:
    name: Helm chart
    needs: resolve
    if: needs.resolve.outputs.stable == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: Checkout (released tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' |
            helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Package & Push
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm package chart/interloper --destination dist --version "$VERSION" --app-version "$VERSION"
          helm push "dist/interloper-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"
