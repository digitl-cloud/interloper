name: Publish

# Publishes the artifacts for a released tag: the Docker images and the Helm
# chart, all to GHCR. Decoupled from the Release workflow so a failed publish
# can be
# replayed without re-running semantic-release (which would find nothing to
# release and skip everything).
#
# Triggers:
#   - automatically when semantic-release publishes the GitHub release
#     (created with the GitHub App token, so the event fires workflows).
#     Not the tag push: the release commit message carries `[skip ci]`,
#     which suppresses the push event for the tag pointing at it — the
#     `release` event is immune to skip instructions;
#   - manually via workflow_dispatch with an existing tag, to re-publish
#     after a transient failure.
#
# Every job is idempotent: re-running it re-pushes the same tags.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true
        type: string

jobs:
  resolve:
    name: Resolve tag
    # Only semantic-release tags are published: the no-`v` chart releases
    # chart-releaser left behind must never re-trigger this workflow.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      stable: ${{ steps.resolve.outputs.stable }}

    steps:
      - name: Resolve tag
        id: resolve
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          case "$version" in
            *-rc*) stable=false ;;
            *)     stable=true ;;
          esac
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "stable=${stable}"
          } >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────
  # Docker images → GitHub Container Registry (ghcr.io)
  #
  # One image per role, tagged with the released version (plus `latest` on
  # stable releases only). Each Python role ships two variants: the loaded
  # image on the bare tag, and the extras-free one on a "-slim" tag. The
  # matrix mirrors the image catalog in the Makefile (ROLES + SLIM_ROLES),
  # keep the two in sync.
  # ────────────────────────────────────────────────────────────────────
  docker:
    name: Docker (${{ matrix.target }})
    needs: resolve
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      packages: "write"

    strategy:
      fail-fast: false
      matrix:
        # target → dockerfile target (also the Makefile stem)
        # role   → image name (interloper-<role>); suffix → tag suffix
        include:
          - { target: api,            role: api,       suffix: "" }
          - { target: api-slim,       role: api,       suffix: "-slim" }
          - { target: frontend,       role: frontend,  suffix: "" }
          - { target: core,           role: core,      suffix: "" }
          - { target: core-slim,      role: core,      suffix: "-slim" }
          - { target: mcp,            role: mcp,       suffix: "" }
          - { target: mcp-slim,       role: mcp,       suffix: "-slim" }
          - { target: scheduler,      role: scheduler, suffix: "" }
          - { target: scheduler-slim, role: scheduler, suffix: "-slim" }

    steps:
      - name: Checkout (released tag)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup QEMU
        # Registers binfmt handlers so the amd64 runner can build the
        # linux/arm64 image via emulation.
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/interloper-${{ matrix.role }}"
          suffix="${{ matrix.suffix }}"
          tags="${repo}:${{ needs.resolve.outputs.version }}${suffix}"
          if [ "${{ needs.resolve.outputs.stable }}" = "true" ]; then
            tags="${tags},${repo}:latest${suffix}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # No build args: the dockerfile's own defaults define what a loaded
      # image carries, and the slim targets take no extras at all.
      - name: Build & Push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,scope=docker-${{ matrix.target }},mode=max

  # ────────────────────────────────────────────────────────────────────
  # Helm chart → GitHub Container Registry (ghcr.io)
  #
  # Pushed as an OCI artifact beside the images it deploys, carrying the same
  # version, so the chart needs no index file and no GitHub Pages. Stable
  # releases only — RC chart versions would clutter the registry. Chart
  # `version`/`appVersion` are bumped by semantic-release, so the checked-out
  # tag is ready to ship.
  # ────────────────────────────────────────────────────────────────────
  helm:
    name: Helm chart
    needs: resolve
    if: needs.resolve.outputs.stable == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: Checkout (released tag)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' |
            helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Package & Push
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm package chart/interloper --destination dist
          helm push "dist/interloper-${{ needs.resolve.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"
