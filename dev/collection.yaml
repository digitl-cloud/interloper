# What `make dev-up` declares in the repository's dev organisation: `interloper dev -f collection.yaml`
# applies it on every start, read-only in the app. Edit it and save: the platform restarts with the change.
# The demo source writes a dataset of its own, so it never collides with a demo source made in the app.

key: demo_source
id: demo
init:
  dataset: dev_demo
---
key: cron_job
id: demo-daily
init:
  cron: "0 6 * * *"
  enabled: true
  targets:
    - ref: demo
