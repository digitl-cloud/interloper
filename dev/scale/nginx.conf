events {
    worker_connections 4096;
}

http {
    # Both api replicas, resolved once at start: Docker's DNS answers the
    # service name with every replica's address.
    #
    # A browser stays on one replica. Production's load balancer puts a page's
    # parallel requests on the same replica two times in three, where they wait
    # for each other in its one Python process; round robin would always split
    # them and hide that wait.
    upstream api {
        hash $cookie_session_token consistent;
        server api:3000;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 80;
        access_log off;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
