# Scale-test stack: Postgres held to the production database's shape, two api
# replicas behind a proxy that keeps a browser on one replica, and between the
# api and Postgres the round trip production's database proxy costs.
#
#   make scale-up      # build the api image from this checkout and start the stack
#   make scale-down    # stop it and drop the database volume
#
# The generator, the load driver and the scheduler probe run from the
# workspace against it (see the Makefile's scale-* targets). Throwaway
# credentials, never reused anywhere real.
#
# SCALE_DATABASE_DELAY_MS is the delay added to a round trip from the api to
# Postgres, set so the round trip costs what production's does (2.5 ms). What
# the stack does not reproduce is in AGENTS.md, "Scale test".

name: interloper-scale

x-interloper-env: &interloper-env
  INTERLOPER_POSTGRES_HOST: database-proxy
  INTERLOPER_POSTGRES_PORT: "5432"
  INTERLOPER_POSTGRES_USER: postgres
  INTERLOPER_POSTGRES_PASSWORD: postgres
  INTERLOPER_POSTGRES_DATABASE: interloper
  INTERLOPER_ENCRYPTION_KEY: scale-encryption-key-not-for-production
  INTERLOPER_SERVER_EXTERNAL_URL: http://localhost:3010

services:
  # The production instance's tier: 1 vCPU, 3.75GB of memory, a third of it
  # shared buffers, Postgres 17. pg_stat_statements ranks what the load costs.
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_buffers=1280MB
      - -c
      - effective_cache_size=2560MB
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interloper
    ports:
      - "5434:5432"
    volumes:
      - scale-pgdata:/var/lib/postgresql/data
    cpus: 1
    mem_limit: 3840m
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interloper"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Production's database proxy: every round trip from the api crosses it, and
  # with it every statement, BEGIN, ROLLBACK and pool ping a request makes. The
  # kernel holds each packet leaving this relay for half the delay, so both
  # directions pay it. The delay is less than the round trip it aims for: the
  # relay and a virtual machine's timers add the rest.
  database-proxy:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache iproute2 socat
    image: interloper-database-proxy:scale
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DELAY_MS: ${SCALE_DATABASE_DELAY_MS:-1.5}
    command:
      - sh
      - -c
      - >-
        tc qdisc add dev eth0 root netem limit 10000 delay $$(awk "BEGIN { print $$DELAY_MS / 2 }")ms
        && exec socat TCP-LISTEN:5432,fork,reuseaddr,nodelay TCP:postgres:5432,nodelay

  # Production's api: two replicas, 1Gi each. CPU is a request, not a limit, in
  # production; SCALE_API_CPUS caps each replica here (one core by default).
  api:
    build:
      context: ../..
      dockerfile: dockerfile
      target: api
    image: interloper-api:scale
    depends_on:
      database-proxy:
        condition: service_started
    working_dir: /interloper
    environment: *interloper-env
    volumes:
      - ../interloper.yaml:/interloper/interloper.yaml:ro
    mem_limit: 1g
    cpus: ${SCALE_API_CPUS:-1}
    deploy:
      replicas: 2

  proxy:
    image: nginx:1.29-alpine
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3010:80"

volumes:
  scale-pgdata:
